name: Fix BOOK LAB v5.4
on:
  workflow_dispatch:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch renderer
        shell: bash
        run: |
          python3 -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(); s=s.replace('BOOK LAB v5.3 WEBGL','BOOK LAB v5.4 WEBGL'); s=s.replace('function setupGL(){gl.frontFace(gl.CW);gl.enable(gl.DEPTH_TEST);','function setupGL(){gl.enable(gl.DEPTH_TEST);'); s=s.replace('uniform float uFlip;\\nout vec4 outColor;','uniform float uFlip;\\nuniform float uMode;\\nout vec4 outColor;'); s=s.replace('  bool front=gl_FrontFacing;\\n  if(!front && uFlip < 0.48) discard;\\n  vec2 uv=front?vUV:vec2(1.0-vUV.x,vUV.y);\\n  vec4 c=front?samplePage(uFront,uv,uFrontOpacity,uFrontMat):samplePage(uBack,uv,uBackOpacity,uBackMat);','  bool staticPage = uMode < 0.5;\\n  bool front = staticPage ? true : !gl_FrontFacing;\\n  if(!staticPage && !front && uFlip < 0.48) discard;\\n  vec2 uv=front?vUV:vec2(1.0-vUV.x,vUV.y);\\n  vec4 c=front?samplePage(uFront,uv,uFrontOpacity,uFrontMat):samplePage(uBack,uv,uBackOpacity,uBackMat);'); p.write_text(s)"
      - name: Commit
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Fix page visibility during flip" || exit 0
          git push

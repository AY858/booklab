name: Fix BOOK LAB front face
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch WebGL front-face orientation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('BOOK LAB v5.2 WEBGL','BOOK LAB v5.3 WEBGL')
          s=s.replace('function setupGL(){gl.enable(gl.DEPTH_TEST);','function setupGL(){gl.frontFace(gl.CW);gl.enable(gl.DEPTH_TEST);')
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix mirrored page orientation" || exit 0
          git push

name: Apply BOOK LAB v5.7 sort
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Windows-style natural filename sort
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('BOOK LAB v5.6 WEBGL','BOOK LAB v5.7 WEBGL')
          s=s.replace('拖图片到这里 · 导入文件夹保留读取顺序','拖图片到这里 · 文件夹按源文件名自然排序')
          old="function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)}function sortN(a,b){return a.name.localeCompare(b.name,undefined,{numeric:true,sensitivity:'base'})}"
          new="""function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)}
const winCollator=new Intl.Collator('zh-CN',{numeric:true,sensitivity:'base',ignorePunctuation:false});
function windowsNameSort(a,b){
  const A=(a.name||'').normalize('NFKC'),B=(b.name||'').normalize('NFKC');
  const ma=A.match(/^(\\d+)/),mb=B.match(/^(\\d+)/);
  if(ma&&mb){
    const na=Number(ma[1]),nb=Number(mb[1]);
    if(na!==nb)return na-nb;
    if(ma[1].length!==mb[1].length)return mb[1].length-ma[1].length;
  }else if(ma&&!mb)return -1;else if(!ma&&mb)return 1;
  return winCollator.compare(A,B);
}
function sortN(a,b){return windowsNameSort(a,b)}"""
          if old not in s:
              raise SystemExit('sort function anchor not found')
          s=s.replace(old,new)
          old2="async function addFiles(fs,preserveOrder=false){const arr=[...fs].filter(f=>f.type.startsWith('image/'));if(!preserveOrder)arr.sort(sortN);"
          new2="async function addFiles(fs,preserveOrder=false){const arr=[...fs].filter(f=>f.type.startsWith('image/'));arr.sort(windowsNameSort);"
          if old2 not in s:
              raise SystemExit('addFiles anchor not found')
          s=s.replace(old2,new2)
          p.write_text(s)
          PY
      - name: Commit v5.7
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Sort folder imports by source filename naturally" || exit 0
          git push
# trigger v5.7
